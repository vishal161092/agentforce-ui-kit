<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid slds-theme_shade">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:choice" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>{questionLabel}</span>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-card__body_inner slds-p-vertical_small">
            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:else>
                <template lwc:if={hasData}>
                    <div class="html-content" lwc:inner-html={htmlContent}></div>
                </template>
                <template lwc:else>
                    <div class="slds-text-align_center slds-p-around_medium">
                        <p class="slds-text-color_weak">Waiting for agent data...</p>
                    </div>
                </template>
            </template>
        </div>
    </article>
</template>
